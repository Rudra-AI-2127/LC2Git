<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LC2Git</title>

    <link
        rel="stylesheet"
        href="popup.css"
    >

</head>


<body>

    <div class="container">

        <h1>LC2Git</h1>

        <p class="subtitle">
            LeetCode → GitHub
        </p>


        <!-- GitHub Status -->

        <div class="status">

            <span id="statusDot">
                ●
            </span>

            <span id="statusText">
                Not connected
            </span>

        </div>


        <!-- Token Section -->

        <div id="connectSection">

            <label for="githubToken">
                GitHub Token
            </label>

            <input
                type="password"
                id="githubToken"
                placeholder="ghp_..."
                autocomplete="off"
            >

            <button id="connectGithub">
                Connect GitHub
            </button>

        </div>


        <!-- Connected Section -->

        <div
            id="connectedSection"
            style="display: none;"
        >

            <p>
                Connected as:
                <strong id="githubUsername">
                    -
                </strong>
            </p>

            <button id="disconnectGithub">
                Disconnect GitHub
            </button>

        </div>


        <!-- Repository -->

        <div class="repo">

            <p>
                Repository
            </p>

            <strong id="repoName">
                Rudra-AI-2127/leetcode-solutions
            </strong>

        </div>


        <!-- Stats -->

        <div class="stats">

            <div class="stat">

                <span id="syncedCount">
                    0
                </span>

                <small>
                    Synced
                </small>

            </div>


            <div class="stat">

                <span id="commitCount">
                    0
                </span>

                <small>
                    Commits
                </small>

            </div>

        </div>


        <!-- Recent History -->

        <div class="history">

            <div class="historyHeader">
                Recent Syncs
            </div>

            <div id="historyList">

                <p class="emptyHistory">
                    No synced solutions yet.
                </p>

            </div>

        </div>


        <!-- Sync -->

        <button
            id="syncNow"
            disabled
        >
            Sync Current Problem
        </button>


        <p id="message"></p>

    </div>


    <script src="popup.js"></script>

</body>

</html>
