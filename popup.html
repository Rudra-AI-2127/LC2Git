<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LC2Git</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <h1>LC2Git</h1>

        <p class="subtitle">
            LeetCode → GitHub
        </p>

        <div class="status">
            <span id="statusDot">●</span>
            <span id="statusText">Not connected</span>
        </div>

        <button id="connectGithub">
            Connect GitHub
        </button>

        <div class="repo">
            <p>Repository</p>
            <strong id="repoName">
                Rudra-AI-2127/leetcode-solutions
            </strong>
        </div>

        <div class="stats">

            <div class="stat">
                <span id="syncedCount">0</span>
                <small>Synced</small>
            </div>

            <div class="stat">
                <span id="commitCount">0</span>
                <small>Commits</small>
            </div>

        </div>

        <button id="syncNow">
            Sync Current Problem
        </button>

        <p id="message"></p>

    </div>

    <script src="popup.js"></script>

</body>
</html>
